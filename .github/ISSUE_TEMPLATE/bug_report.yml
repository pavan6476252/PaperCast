name: Bug Report
description: Create a report to help us improve FormCast
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: How can we reproduce this bug?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of FormCast are you using?
    validations:
      required: true
